<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">

  <body>
    <style>
      :root {
          --header: #2e2d39;
          --border: #555566;
          --page: #121212;
          --deep: #eeeeee;
          --text: #cccccc;
          --accent: #a8a5ff;
          --qrbg: #eeeeee;
          --qrfg: #121212;
      }
    </style>
    <style>
      body {
        padding: 0 1em;
        max-width: 90ch;
        margin: auto;
        overflow-x: hidden;
      }
      .squiggles {
        display: flex;
        justify-content: center;
      }
      .squiggles svg {
        height: unset;
      }
      
      html, body {
        background: var(--page);
        color: var(--text);
        font-size: 16px;
        font-family: "JetBrainsMono NF";
      }
      header, footer {
        background: var(--header);
        box-shadow: 0 0 0 100vmax var(--header);
        clip-path: inset(0 -100vmax);
        padding: 1em 0;
      }
      .squiggles:last-of-type svg {
        position: absolute;
        bottom: 3.2em;
      }
      footer {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        text-align: center;
      }
      h1, h2, h3, h4, a, strong {
        color: var(--accent);
      }
    </style>
